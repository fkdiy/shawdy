name: PHP

on:
  pull_request:
    paths:
      - 'apps/backend/**/*.php'
      - 'apps/backend/composer.json'
      - 'apps/backend/composer.lock'
      - 'apps/backend/phpstan.dist.neon'
      - 'apps/backend/.php-cs-fixer.dist.php'
      - 'apps/backend/phpunit.dist.xml'
      - '.github/workflows/php.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**/*.php'
      - 'apps/backend/composer.json'
      - 'apps/backend/composer.lock'
      - 'apps/backend/phpstan.dist.neon'
      - 'apps/backend/.php-cs-fixer.dist.php'
      - 'apps/backend/phpunit.dist.xml'
      - '.github/workflows/php.yml'

defaults:
  run:
    working-directory: ./apps/backend

jobs:
  tests:
    name: PHP Checks
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_NAME: shawdy_app
      DATABASE_USER: app
      DATABASE_PASSWORD: dev_only_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      TRUSTED_PROXIES: 172.19.0.0/16

    services:
      mariadb:
        image: mariadb:12.3
        env:
          MYSQL_DATABASE: shawdy_app_test
          MYSQL_USER: app
          MYSQL_PASSWORD: dev_only_password
          MYSQL_ROOT_PASSWORD: dev_only_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_mysql, zip, redis
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Scan dependencies for security vulnerabilities
        run: composer audit

      # --- CODE STYLE & STATIC ANALYSIS ---
      - name: Coding standards analysis via PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Build Symfony container for PHPStan
        env:
          APP_ENV: dev
        run: php bin/console cache:warmup

      - name: Lint Symfony container
        env:
          APP_ENV: dev
        run: php bin/console lint:container

      - name: Static Analysis via PHPStan
        run: vendor/bin/phpstan analyse

      # --- DATABASE DEPENDENT CHECKS ---
      - name: Create test database
        run: php bin/console doctrine:database:create --if-not-exists

      - name: Validate Doctrine schema mapping
        run: php bin/console doctrine:schema:validate --skip-sync

      - name: Prepare Database Schema
        run: php bin/console doctrine:schema:update --force

      - name: Execute Tests via PHPUnit
        run: vendor/bin/phpunit
