name: Deploy production

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Verify release commit is on main
        shell: bash
        run: |
          git fetch origin main

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag must point to a commit on main."
            exit 1
          fi

  build-images:
    name: Build ${{ matrix.name }}
    needs:
      - validate-release

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: backend
            image: ghcr.io/fkdiy/shawdy-backend
            context: .
            dockerfile: docker/frankenphp/Dockerfile

          - name: frontend
            image: ghcr.io/fkdiy/shawdy-frontend
            context: .
            dockerfile: docker/node/Dockerfile

          - name: redirector
            image: ghcr.io/fkdiy/shawdy-redirector
            context: ./apps/redirector
            dockerfile: docker/redirector/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to production
    needs:
      - build-images

    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: read

    env:
      DEPLOY_HOST: shawdy.de
      DEPLOY_USER: deploy
      DEPLOY_DIR: /opt/shawdy
      SHAWDY_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SHAWDY_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SHAWDY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_shawdy_deploy
          chmod 600 ~/.ssh/id_ed25519_shawdy_deploy

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH connection
        run: |
          ssh \
            -i ~/.ssh/id_ed25519_shawdy_deploy \
            -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'echo "SSH connection successful"'

      - name: Upload production Compose configuration
        run: |
          scp \
            -i ~/.ssh/id_ed25519_shawdy_deploy \
            -o IdentitiesOnly=yes \
            compose.production.yaml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR}/compose.production.yaml"

      - name: Log production server in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | ssh \
                -i ~/.ssh/id_ed25519_shawdy_deploy \
                -o IdentitiesOnly=yes \
                "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "docker login ghcr.io \
                  --username '${GITHUB_ACTOR}' \
                  --password-stdin"

      - name: Pull release images
        run: |
          ssh \
            -i ~/.ssh/id_ed25519_shawdy_deploy \
            -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd ${DEPLOY_DIR} && \
            SHAWDY_VERSION='${SHAWDY_VERSION}' \
            docker compose \
              --env-file .env \
              -f compose.production.yaml \
              pull frankenphp node redirector"

      - name: Start production dependencies
        run: |
          ssh \
            -i ~/.ssh/id_ed25519_shawdy_deploy \
            -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd ${DEPLOY_DIR} && \
            SHAWDY_VERSION='${SHAWDY_VERSION}' \
            docker compose \
              --env-file .env \
              -f compose.production.yaml \
              up -d --wait db redis"

      - name: Run database migrations
        run: |
          ssh \
            -i ~/.ssh/id_ed25519_shawdy_deploy \
            -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd ${DEPLOY_DIR} && \
            SHAWDY_VERSION='${SHAWDY_VERSION}' \
            docker compose \
              --env-file .env \
              -f compose.production.yaml \
              run --rm --no-deps \
              frankenphp \
              php bin/console doctrine:migrations:migrate \
              --no-interaction"

      - name: Initialize redirect read model
        run: |
          ssh \
            -i ~/.ssh/id_ed25519_shawdy_deploy \
            -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd ${DEPLOY_DIR} && \
            SHAWDY_VERSION='${SHAWDY_VERSION}' \
            docker compose \
              --env-file .env \
              -f compose.production.yaml \
              run --rm --no-deps \
              frankenphp \
              php bin/console app:redirect-read-model:rebuild \
              --if-uninitialized"

      - name: Start application
        run: |
          ssh \
            -i ~/.ssh/id_ed25519_shawdy_deploy \
            -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd ${DEPLOY_DIR} && \
            SHAWDY_VERSION='${SHAWDY_VERSION}' \
            docker compose \
              --env-file .env \
              -f compose.production.yaml \
              up -d \
              --wait \
              --remove-orphans \
              --pull never"

      - name: Verify backend health
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 20 \
            --retry-delay 3 \
            --retry-all-errors \
            https://shawdy.de/healthz

      - name: Verify frontend
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --output /dev/null \
            --retry 20 \
            --retry-delay 3 \
            --retry-all-errors \
            https://shawdy.de/

      - name: Persist release version
        run: |
          printf 'SHAWDY_VERSION=%s\n' "${SHAWDY_VERSION}" \
            | ssh \
                -i ~/.ssh/id_ed25519_shawdy_deploy \
                -o IdentitiesOnly=yes \
                "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "cat > ${DEPLOY_DIR}/.release.env"

      - name: Show production services
        if: always()
        continue-on-error: true
        run: |
          ssh \
            -i ~/.ssh/id_ed25519_shawdy_deploy \
            -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd ${DEPLOY_DIR} && \
            SHAWDY_VERSION='${SHAWDY_VERSION}' \
            docker compose \
              --env-file .env \
              -f compose.production.yaml \
              ps"

      - name: Log production server out of GHCR
        if: always()
        continue-on-error: true
        run: |
          ssh \
            -i ~/.ssh/id_ed25519_shawdy_deploy \
            -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker logout ghcr.io || true"
