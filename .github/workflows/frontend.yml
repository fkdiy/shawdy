name: Frontend

on:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - 'apps/backend/**'
      - 'docker/frankenphp/**'
      - 'compose.yaml'
      - 'compose.ci.yaml'
      - '.github/workflows/frontend.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/**'
      - 'apps/backend/**'
      - 'docker/frankenphp/**'
      - 'compose.yaml'
      - 'compose.ci.yaml'
      - '.github/workflows/frontend.yml'

defaults:
  run:
    working-directory: ./apps/frontend

jobs:
  install-and-audit:
    name: Install, Audit & Cache Workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: './apps/frontend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

  eslint:
    name: Lint JS & TS
    runs-on: ubuntu-latest
    needs: install-and-audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: './apps/frontend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: Type Check (Nuxt)
    runs-on: ubuntu-latest
    needs: install-and-audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: './apps/frontend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Nuxt typecheck
        run: pnpm typecheck

  vitest:
    name: Unit Tests via Vitest
    runs-on: ubuntu-latest
    needs: install-and-audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: './apps/frontend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm test:run

  playwright:
    name: Execute E2E tests via Playwright
    runs-on: ubuntu-latest
    needs: install-and-audit

    env:
      COMPOSE_FILE: compose.ci.yaml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build application stack
        working-directory: .
        run: docker compose build

      - name: Start application stack
        working-directory: .
        run: |
          docker compose up -d messenger-worker
          docker compose up -d --wait --wait-timeout 300 \
            db redis node redirector frankenphp

      - name: Show application status
        working-directory: .
        run: docker compose ps

      - name: Verify application
        working-directory: .
        run: |
          docker compose exec -T frankenphp \
            curl --fail --show-error http://localhost:8082/healthz

          docker compose exec -T frankenphp \
            curl --fail --show-error http://node:3000/ > /dev/null

      - name: Run Playwright
        working-directory: .
        run: docker compose run --rm --no-deps playwright

      - name: Show Docker logs on failure
        if: ${{ failure() }}
        working-directory: .
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/frontend/app/tests/e2e/playwright-report/
          retention-days: 30

      - name: Stop application stack
        if: ${{ always() }}
        working-directory: .
        run: docker compose down -v

  build:
    name: Try to build frontend
    runs-on: ubuntu-latest
    needs: install-and-audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: './apps/frontend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Nuxt build
        run: pnpm build
