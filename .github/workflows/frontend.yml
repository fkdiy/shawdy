name: Frontend

on:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend.yml'

defaults:
  run:
    working-directory: ./apps/frontend

jobs:
  # Prepare and audit
  install-and-audit:
    name: Install, Audit & Cache Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache-dependency-path: './apps/frontend/package-lock.json'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

  # Static code analysis
  eslint:
    name: Lint JS & TS
    runs-on: ubuntu-latest
    needs: install-and-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  vue-tsc:
    name: Type Check (Vue & TS)
    runs-on: ubuntu-latest
    needs: install-and-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Run vue-tsc
        run: npm run type-check --force

  oxfmt:
    name: Check formatting
    runs-on: ubuntu-latest
    needs: install-and-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Run oxfmt
        run: npm run format:check

  # Unit tests
  vitest:
    name: Unit Tests via Vitest
    runs-on: ubuntu-latest
    needs: install-and-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm run test

  # E2E Tests
  playwright:
    name: Execute E2E tests via Playwright
    runs-on: ubuntu-latest
    needs: install-and-audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Start application stack
        working-directory: .
        run: |
          docker compose build
          docker compose up -d messenger-worker
          docker compose up -d --wait --wait-timeout 300 \
            db redis node redirector frankenphp

      - name: Show application status
        working-directory: .
        run: docker compose ps

      - name: Verify application
        working-directory: .
        run: |
          docker compose exec -T frankenphp \
            curl --fail --show-error http://localhost:8080/healthz

          docker compose exec -T frankenphp \
            curl --fail --show-error http://node:3000/ > /dev/null

      - name: Run Playwright
        env:
          CI: "true"
        working-directory: .
        run: docker compose run --rm --no-deps playwright

      - name: Show Docker logs on failure
        if: ${{ failure() }}
        working-directory: .
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/frontend/tests/e2e/playwright-report/
          retention-days: 30

      - name: Stop application stack
        if: ${{ always() }}
        working-directory: .
        run: docker compose down -v

  # Build test
  build:
    name: Try to build frontend
    runs-on: ubuntu-latest
    needs: install-and-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Run npm run build
        run: npm run build
