name: Docker

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  hadolint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest

    container:
      image: hadolint/hadolint:latest-alpine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Lint Dockerfiles
        run: |
          find docker/ -name "Dockerfile" -exec hadolint {} +
