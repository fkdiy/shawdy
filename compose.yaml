services:
  frankenphp:
    container_name: shawdy-frankenphp
    image: frankenphp-shawdy:development
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
      target: development
    depends_on:
      db:
        condition: service_healthy
      node:
        condition: service_healthy
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
      - "443:443/udp" # HTTP/3
    expose:
      - "8080"
    volumes:
      - ./apps/backend:/app
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_ENV: "dev"
      SERVER_NAME: "http://localhost"
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_PORT: ${DATABASE_PORT:-3306}
      DATABASE_NAME: ${DATABASE_NAME:-shawdy_app}
      DATABASE_USER: ${DATABASE_USER:-app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-dev_only_password}
    networks:
      - shawdy-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/healthz" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  messenger-worker:
    container_name: shawdy-messenger-worker
    image: frankenphp-shawdy
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
    environment:
      APP_ENV: "dev"
      SERVER_NAME: "http://localhost"
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_PORT: ${DATABASE_PORT:-3306}
      DATABASE_NAME: ${DATABASE_NAME:-shawdy_app}
      DATABASE_USER: ${DATABASE_USER:-app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-dev_only_password}
    networks:
      - shawdy-net
    command: php bin/console messenger:consume async --time-limit=3600
    entrypoint: []

  node:
    container_name: shawdy-node
    image: shawdy-node:development
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: development
    expose:
      - "3000"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: "development"
      NUXT_API_BASE_INTERNAL: "http://frankenphp:8080/api"
      NUXT_PUBLIC_API_BASE: "/api"
    networks:
      - shawdy-net
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "3000" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    command: npm run dev -- --host 0.0.0.0 --port 3000
    working_dir: /app

  db:
    container_name: shawdy-db
    image: mariadb:12.3
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-shawdy_app}
      MYSQL_USER: ${DATABASE_USER:-app}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-dev_only_password}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-dev_only_root_password}
    networks:
      - shawdy-net
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: shawdy-redis
    image: redis:8.10.1-alpine
    networks:
      - shawdy-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  playwright:
    container_name: shawdy-playwright
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    depends_on:
      node:
        condition: service_started
      frankenphp:
        condition: service_healthy
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    environment:
      PLAYWRIGHT_BASE_URL: "http://frankenphp:8080"
    networks:
      - shawdy-net
    command: sh -c "npm ci && npm run test:e2e"
    profiles:
      - test
    working_dir: /app

volumes:
  mariadb_data:
  caddy_data:
  caddy_config:


networks:
  shawdy-net:
    name: shawdy-network
