services:
  frankenphp:
    image: frankenphp-shawdy
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
      target: development
    environment:
      SERVER_NAME: localhost
      APP_ENV: dev
    ports: 
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
      - "443:443/udp" # HTTP/3
    volumes:
      - ./:/app
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:12.3
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      
  node:
    image: shawdy-node
    build:
        context: .
        dockerfile: docker/node/Dockerfile
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:5173:5173"
    command: npm run dev -- --host 0.0.0.0

  playwright:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /app
    volumes:
      - ./frontend:/app
    depends_on:
      frankenphp:
        condition: service_healthy

volumes:
  mariadb_data:
  caddy_data:
  caddy_config:
