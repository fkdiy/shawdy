services:
  nginx:
    image: nginx:1.31.3
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

  php:
    image: php:8.5-fpm
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
    - .:/var/www/html
