seo:
  title: Shawdy URL shortener
  description: A WIP learning project for exploring modern web development. Also shortens URL.

hero:
  headline: Go shawdy, it's your birthday
  title: "I build yet another\nURL shortener"
  description: Shawdy is my WIP learning project for exploring Git, Docker, CI/CD, Symfony, API Platform, Vue.js and Nuxt, and modern web development with a hint of Go.
  links:
    - label: Find out more
      to: "#ecosystem"
      target: _self
      size: xl
    - label: View on GitHub
      icon: i-simple-icons-github
      size: xl
      color: neutral
      variant: subtle
      to: https://github.com/fkdiy/shawdy
      target: _blank
  urlShortener:
    icon: i-lucide-link
    cta: Shorten your URL
    placeholder: Paste your long URL here ...
    buttonLabel: Shorten
    resultTitle: Your short URL

landingEcosystem:
  headline: The ecosystem
  title: "Based on a modern stack"
  description: Shawdy combines specialized, fully containerized services to keep each part of the application focused on what it does best.
  items:
    - icon: i-lucide-globe-code
      title: FrankenPHP Edge Server
      description: Powered by Caddy, handling TLS and routing requests to the frontend, backend and Go redirector.
    - icon: i-lucide-brain-circuit
      title: Symfony Backend
      description: Handles the application's business logic and exposes its API through API Platform.
    - icon: i-lucide-monitor-smartphone
      title: Nuxt Frontend
      description: Provides the server-rendered user interface and communicates with the Symfony API.
    - icon: i-lucide-database
      title: MariaDB Storage
      description: Acts as Shawdy's reliable and persistent data store and single source of truth.
    - icon: i-lucide-database-zap
      title: Redis Read Model
      description: Provides a low-latency read model for redirects, synced with MariaDB through Symfony Messenger.
    - icon: i-lucide-rabbit
      title: Go Redirector
      description: Resolves short codes through Redis and performs redirects on a minimal, latency-sensitive request path.

landingFeaturePreview:
  headline: Feature Preview
  title: "The best is yet to come"
  description: Shawdy is still in its infancy. The following features and more will be implemented in future versions.
  items:
    - icon: i-lucide-users
      title: Personal dashboard
      description: Create, save and manage your own short codes, receive messages and much more.
    - icon: i-lucide-chart-line
      title: Statistics & Analytics
      description: Find out how often, when, from which region and on which devices your short URLs were accessed.
    - icon: i-lucide-snail
      title: Custom slugs
      description: Customize your short URLs with your own slugs in the format shawdy.de/myslug/code.
    - icon: i-lucide-qr-code
      title: QR codes
      description: Create QR codes for your short URLs for use on the web or in print media.
    - icon: i-lucide-houses
      title: Custom domains
      description: Add your own domains to Shawdy to create even more personalized short URLs.
    - icon: i-lucide-cable
      title: API support
      description: Access, create or delete your short URLs from anywhere without using the website.
