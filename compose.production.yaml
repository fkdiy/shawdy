services:
  frankenphp:
    container_name: shawdy-frankenphp
    image: frankenphp-shawdy:production
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      node:
        condition: service_healthy
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
      - "443:443/udp" # HTTP/3
    expose:
      - "8080"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SERVER_NAME: "http://localhost"
      APP_ENV: "prod"
      APP_DEBUG: "0"
      TRUSTED_PROXIES: 172.19.0.0/16
    networks:
      - shawdy-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/healthz" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    pull_policy: build

  messenger-worker:
    container_name: shawdy-messenger-worker
    image: frankenphp-shawdy
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redirector:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
    environment:
      APP_ENV: "dev"
      SERVER_NAME: "http://localhost"
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_PORT: ${DATABASE_PORT:-3306}
      DATABASE_NAME: ${DATABASE_NAME:-shawdy_app}
      DATABASE_USER: ${DATABASE_USER:-app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-dev_only_password}
      TRUSTED_PROXIES: 172.19.0.0/16
    command: php bin/console messenger:consume async --time-limit=3600
    entrypoint: []

  node:
    container_name: shawdy-node
    image: shawdy-node:production
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: production
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: "production"
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "3000"
      NUXT_API_BASE_INTERNAL: "http://frankenphp:8080/api"
      NUXT_PUBLIC_API_BASE: "/api"
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "3000" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    pull_policy: build

  redirector:
    image: shawdy-redirector:production
    build:
      context: ./apps/redirector
      dockerfile: ../../docker/redirector/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIRECTOR_ADDR: ":8081"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/healthz" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    pull_policy: build

  db:
    container_name: shawdy-db
    image: mariadb:12.3
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    container_name: shawdy-redis
    image: redis:8.10.1-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mariadb_data:
  caddy_data:
  caddy_config:


networks:
  shawdy-net:
    name: shawdy-network
