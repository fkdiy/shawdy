x-app-security: &app-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-environment: &backend-environment
  APP_ENV: "prod"
  APP_DEBUG: "0"

  APP_SECRET: ${APP_SECRET:?APP_SECRET must be set}
  DEFAULT_URI: ${DEFAULT_URI:?DEFAULT_URI must be set}

  DATABASE_HOST: "db"
  DATABASE_PORT: "3306"
  DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME must be set}
  DATABASE_USER: ${DATABASE_USER:?DATABASE_USER must be set}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"

  MAILER_DSN: ${MAILER_DSN:?MAILER_DSN must be set}

  CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?CORS_ALLOW_ORIGIN must be set}

  TRUSTED_PROXIES: "172.19.0.0/16"

  MAIL_FROM: ${MAIL_FROM:?MAIL_FROM must be set}
  ABUSE_REPORT_RECIPIENT: ${ABUSE_REPORT_RECIPIENT:?ABUSE_REPORT_RECIPIENT must be set}

services:
  frankenphp:
    <<: *app-security
    container_name: shawdy-frankenphp
    image: frankenphp-shawdy:production
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      node:
        condition: service_healthy
      redirector:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
      - "443:8443/udp"
    expose:
      - "8082"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      <<: *backend-environment
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME must be set}
      CADDY_HTTP_PORT: "8080"
      CADDY_HTTPS_PORT: "8443"
      FRANKENPHP_WORKERS: "4"
    networks:
      - shawdy-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/healthz" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    read_only: true
    tmpfs:
      - /app/var:uid=1000,gid=1000,mode=0755
      - /tmp:uid=1000,gid=1000,mode=1777

  messenger-worker:
    <<: *app-security
    container_name: shawdy-messenger-worker
    image: frankenphp-shawdy:production
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-environment
    networks:
      - shawdy-net
    healthcheck:
      disable: true
    command: php bin/console messenger:consume async --time-limit=3600
    logging: *default-logging
    read_only: true
    tmpfs:
      - /app/var:uid=1000,gid=1000,mode=0755
      - /tmp:uid=1000,gid=1000,mode=1777

  node:
    <<: *app-security
    container_name: shawdy-node
    image: shawdy-node:production
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: production
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: "production"
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "3000"
      NUXT_API_BASE_INTERNAL: "http://frankenphp:8082/api"
      NUXT_PUBLIC_API_BASE: "/api"
    networks:
      - shawdy-net
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    read_only: true

  redirector:
    <<: *app-security
    container_name: shawdy-redirector
    image: shawdy-redirector:production
    build:
      context: ./apps/redirector
      dockerfile: ../../docker/redirector/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIRECTOR_ADDR: ":8081"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    networks:
      - shawdy-net
      - monitoring-net
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/healthz" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    read_only: true

  db:
    container_name: shawdy-db
    image: mariadb:12.3
    restart: unless-stopped
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?DATABASE_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${DATABASE_NAME:?DATABASE_NAME must be set}
      MYSQL_USER: ${DATABASE_USER:?DATABASE_USER must be set}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
    networks:
      - shawdy-net
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  redis:
    container_name: shawdy-redis
    image: redis:8.10.1-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - shawdy-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging
    read_only: true

volumes:
  caddy_data:
  caddy_config:
  mariadb_data:
  redis_data:

networks:
  shawdy-net:
    name: shawdy-network

  monitoring-net:
    external: true
    name: monitoring-network
